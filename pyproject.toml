[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-pytools"
version = "0.1.0"
description = "AST-based Python refactoring tools as a Claude Code MCP plugin"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.0.0"]

[project.scripts]
claude-pytools = "claude_pytools.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_pytools"]
