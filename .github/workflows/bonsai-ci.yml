name: bonsai CI

# Hoisted from plugins/bonsai/.github/workflows/ci.yml — GitHub only runs
# workflows at the repo root. Paths are filtered so bonsai's matrix does not
# fire on shell-only changes elsewhere in the suite.

on:
  push:
    paths:
      - 'plugins/bonsai/**'
      - '.github/workflows/bonsai-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/bonsai/**'
      - '.github/workflows/bonsai-ci.yml'

jobs:
  py-lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/bonsai/py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check src/
      - run: uvx ruff format --check src/

  py-test:
    name: Python Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: plugins/bonsai/py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest tests/ -v

  py-smoke:
    name: Python Smoke Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: plugins/bonsai/py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --no-dev
      - name: Help checks
        run: |
          uv run python -m bonsai_python --help
          uv run python -m bonsai_python.pyfindrefs --help
          uv run python -m bonsai_python.pyfindunused --help
          uv run python -m bonsai_python.pymove --help
          uv run python -m bonsai_python.pymovesymbol --help
          uv run python -m bonsai_python.pyrename --help
          uv run python -m bonsai_python.pysignature --help
      - name: End-to-end
        run: uv run python -m bonsai_python.pyfindrefs "bonsai_python.pyfindrefs:find_refs"

  ts-lint:
    name: TypeScript Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: plugins/bonsai/ts/package-lock.json
      - run: npm ci
        working-directory: plugins/bonsai/ts
      - run: npx tsc --noEmit
        working-directory: plugins/bonsai/ts

  ts-test:
    name: TypeScript Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: plugins/bonsai/ts/package-lock.json
      - run: npm ci
        working-directory: plugins/bonsai/ts
      - run: npm run build
        working-directory: plugins/bonsai/ts
      - run: npm test
        working-directory: plugins/bonsai/ts

  ts-smoke:
    name: TypeScript Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: plugins/bonsai/ts/package-lock.json
      - run: npm ci && npm run build
        working-directory: plugins/bonsai/ts
      - name: MCP server starts
        working-directory: plugins/bonsai/ts
        run: timeout 3 node dist/server.js || true
      - name: tsfindrefs smoke
        working-directory: plugins/bonsai/ts
        run: node --input-type=module -e "import { findRefs } from './dist/tsfindrefs.js'; console.log(findRefs('src/_common:parseSymbolRef', '$(pwd)'));"
