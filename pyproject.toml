[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bonsai"
version = "0.0.1"
description = "AST-based Python refactoring tools as a Claude Code MCP plugin"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Valentin Figué", email = "valentin.figue@orange.fr" }
]
keywords = [
    "claude", "claude-code", "mcp", "refactoring", "ast",
    "python", "rename", "dead-code", "imports"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pre-commit>=4.0"]

[project.urls]
Homepage = "https://github.com/valentinfigue/bonsai"
Repository = "https://github.com/valentinfigue/bonsai"
Issues = "https://github.com/valentinfigue/bonsai/issues"

[project.scripts]
bonsai       = "bonsai.__main__:main"
pyfindrefs   = "bonsai.pyfindrefs:main"
pycallers    = "bonsai.pycallers:main"
pyfindunused = "bonsai.pyfindunused:main"
pygrep       = "bonsai.pygrep:main"
pymove       = "bonsai.pymove:main"
pymovesymbol = "bonsai.pymovesymbol:main"
pyrename     = "bonsai.pyrename:main"
pysignature  = "bonsai.pysignature:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bonsai"]
artifacts = ["src/bonsai/_hooks_template.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# E501 ignored: MCP tool docstrings are intentionally long (Claude reads the first line)
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python = ".venv"
python-version = "3.11"

[tool.ty.rules]
unresolved-import = "ignore"
