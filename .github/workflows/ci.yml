name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check src/
      - run: uvx ruff format --check src/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  smoke:
    name: Smoke Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - name: Help checks
        run: |
          python -m bonsai_refactor --help
          python -m bonsai_refactor.pyfindrefs --help
          python -m bonsai_refactor.pyfindunused --help
          python -m bonsai_refactor.pymove --help
          python -m bonsai_refactor.pymovesymbol --help
          python -m bonsai_refactor.pyrename --help
          python -m bonsai_refactor.pysignature --help
      - name: End-to-end
        run: python -m bonsai_refactor.pyfindrefs "bonsai_refactor.pyfindrefs:find_refs"
