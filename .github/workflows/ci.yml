name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check src/
      - run: uvx ruff format --check src/

  smoke:
    name: Smoke Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - name: Help checks
        run: |
          python -m bonsai --help
          python -m bonsai.pyfindrefs --help
          python -m bonsai.pyfindunused --help
          python -m bonsai.pymove --help
          python -m bonsai.pymovesymbol --help
          python -m bonsai.pyrename --help
          python -m bonsai.pysignature --help
      - name: End-to-end
        run: python -m bonsai.pyfindrefs "bonsai.pyfindrefs:find_refs"
